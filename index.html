<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<title>Meu Timesheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7;--card:#FFFFFF;--text:#111827;--muted:#6B7280;--line:#E5E7EB;--soft:#EEF0F3;
  --acc:#4338CA;--accText:#4338CA;--ok:#16A34A;--warn:#C2410C;--fat:#4338CA;--nfat:#94A3B8;
  --tab:#2B2F36;--tabText:#C9CDD3;--shadow:0 6px 18px rgba(17,24,39,.10);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1013;--card:#171A1F;--text:#ECEEF1;--muted:#9AA1AC;--line:#2A2F37;--soft:#1F232A;
  --acc:#818CF8;--accText:#A5B4FC;--ok:#4ADE80;--warn:#FB923C;--fat:#818CF8;--nfat:#64748B;
  --tab:#22262D;--tabText:#AEB4BE;--shadow:none;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1013;--card:#171A1F;--text:#ECEEF1;--muted:#9AA1AC;--line:#2A2F37;--soft:#1F232A;
  --acc:#818CF8;--accText:#A5B4FC;--ok:#4ADE80;--warn:#FB923C;--fat:#818CF8;--nfat:#64748B;
  --tab:#22262D;--tabText:#AEB4BE;--shadow:none;color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--accText)}
.app{max-width:820px;margin:0 auto;padding:12px 14px 110px}
.small{font-size:12px;color:var(--muted)}
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 2px 12px;gap:8px}
.hdr h1{margin:0;font-size:19px;font-weight:600;text-align:center}
.hdr .r{justify-self:end}
.card{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0;font-size:15px;font-weight:700}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:14px;font-weight:600;padding:9px 14px;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:42px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.stop{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:14px;font-weight:600;color:var(--muted)}
.clock{font-size:46px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--acc)}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;display:flex}
.bar>div{height:100%}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--soft);font-size:14px}
.list li:last-child{border-bottom:0}
.list .n{flex:1;min-width:0}
.list .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .n span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .v{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.dotc{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ib{border:0;background:transparent;width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted)}
.ib svg{stroke:currentColor}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600}
.field .hint{font-weight:400;color:var(--muted);font-size:11px}
.in,.field input,.field select,.field textarea,td input,td select{width:100%;height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px;font-size:15px}
.field textarea{height:auto;min-height:64px;padding:10px 12px}
.num{text-align:right}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--soft);border-radius:14px;padding:10px 12px}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:18px;font-weight:700;margin-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:inherit;fill:var(--muted);font-size:12px}
.keys{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.keys i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.tablewrap{overflow-x:auto;position:relative}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;font-weight:600;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px;border-bottom:1px solid var(--soft);vertical-align:middle}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px;padding:4px 0}
.preview{font-size:13px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;text-align:center;border:0;background:transparent;border-radius:10px;padding:9px 6px;font-size:14px;font-weight:600;color:var(--muted)}
.seg [aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.wknav{display:flex;align-items:center;gap:6px;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);text-transform:capitalize}
.wknav span{flex:1;text-align:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px;padding:2px 0 6px}
.week button{border:0;background:transparent;border-radius:14px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
.week span{font-size:12px;color:var(--muted)}
.week b{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;font-size:17px;font-weight:500;color:var(--muted)}
.week .today b{color:var(--text);font-weight:800}
.week .sel b{background:var(--text);color:var(--bg);font-weight:800}
.week em{font-style:normal;font-size:11px;font-weight:700;color:var(--accText);min-height:14px;font-variant-numeric:tabular-nums}
.focus{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.plantbox{background:linear-gradient(180deg,var(--soft) 0%,var(--card) 100%);border-radius:20px;padding:8px 14px 0;display:flex;justify-content:center}
.ftext{flex:1;min-width:180px}
.garden{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end}
.garden span{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--muted)}
.runbar{display:flex;align-items:center;gap:10px;background:var(--acc);color:#fff;border-radius:16px;padding:10px 14px;margin-bottom:14px;text-decoration:none}
.runbar b{font-variant-numeric:tabular-nums}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 28px));background:var(--tab);border-radius:999px;display:flex;justify-content:space-around;padding:8px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--tabText);text-decoration:none;font-size:10px;border-radius:999px;padding:8px 0}
.tabbar a svg{stroke:var(--tabText)}
.tabbar a[aria-current="page"]{background:rgba(255,255,255,.14);color:#fff}
.tabbar a[aria-current="page"] svg{stroke:#fff}
dialog{border:0;border-radius:22px;padding:0;background:var(--card);color:var(--text);width:min(500px,calc(100% - 20px));box-shadow:0 20px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:12px}
dialog .row{display:flex;gap:10px}
dialog .row>*{flex:1;min-width:0}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.welcome{background:var(--card);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.welcome h2{margin:0;font-size:22px}
.welcome p{margin:0;color:var(--muted);line-height:1.5}
@media print{.tabbar,.noprint,.runbar{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}.app{padding:0}}
</style>
</head>
<body>
<div class="app"><div id="view"></div></div>
<nav class="tabbar" id="tabbar" aria-label="Menu"></nav>
<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<datalist id="dlDesc"></datalist>

<script>
(function(){
'use strict';
/* ---------- utilidades ---------- */
var DOW=['dom','seg','ter','qua','qui','sex','sáb'],DOWL=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var CORES=['#4338CA','#0F766E','#B45309','#BE185D','#2563EB','#047857','#7C3AED','#C2410C','#475569','#9F1239'];
function uid(){return Math.random().toString(36).slice(2,10);}
function pad(n){return String(n).padStart(2,'0');}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function toD(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=toD(s);d.setDate(d.getDate()+n);return ds(d);}
function today(){return ds(new Date());}
var TODAY=today();
function fmtD(s,long){var d=toD(s);return (long?DOWL[d.getDay()]+', ':'')+pad(d.getDate())+'/'+pad(d.getMonth()+1);}
function fmtDY(s){return fmtD(s)+'/'+String(s).slice(0,4);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pnum(s){s=String(s==null?'':s).trim().replace(/\s/g,'');if(s.indexOf(',')>-1)s=s.replace(/\./g,'').replace(',','.');var n=parseFloat(s);return isFinite(n)?n:0;}
var NF2=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}),NF1=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1});
function brl(n){return 'R$ '+NF2.format(n||0);}
function hm(min){min=Math.round(min||0);return Math.floor(min/60)+'h'+pad(min%60);}          // 1h30
function hhmm(min){min=Math.round(min||0);return Math.floor(min/60)+':'+pad(min%60);}       // 1:30
function dec(min){return NF2.format((min||0)/60);}                                           // 1,50
function hms(sec){sec=Math.max(0,Math.floor(sec));return pad(Math.floor(sec/3600))+':'+pad(Math.floor(sec%3600/60))+':'+pad(sec%60);}
function t2m(t){if(!t)return null;var p=String(t).split(':');return (+p[0])*60+(+p[1]||0);}
function m2t(m){m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60);}
function nowT(d){d=d||new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
// "1:30", "1h30", "1,5", "90m", "90" (minutos se >= 15 e sem separador? não: número puro = horas)
function parseDur(s){s=String(s||'').trim().toLowerCase().replace(/\s/g,'');if(!s)return 0;var m;
  if((m=/^(\d+):(\d{1,2})$/.exec(s)))return +m[1]*60+(+m[2]);
  if((m=/^(\d+)h(\d{1,2})?m?(in)?$/.exec(s)))return +m[1]*60+(+(m[2]||0));
  if((m=/^(\d+)m(in)?$/.exec(s)))return +m[1];
  return Math.round(pnum(s)*60);}
var TRASH='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
var PEN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>';
var PLAY='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>';
var LEFT='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
var RIGHT='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

/* ---------- estado ---------- */
// atividades do time-sheet do Espaider (Gerson Branco Advogados), com o código usado lá
var ESP_ATIVS=['1.003 - ATENDIMENTO AO CLIENTE','1.004 - REUNIÃO','1.005 - DEFESA ADMINISTRATIVA','1.101 - ELABORAÇÃO/ANALISE/REVISÃO DE CONTRATOS','1.102 - PROVIDÊNCIAS COM TERCEIROS','1.103 - REUNIÃO INTERNA',
  '1.104 - PROVIDÊNCIAS ADMINISTRATIVAS','1.105 - ELABORAÇÃO/REVISÃO DE ATOS SOCIETÁRIOS','1.106 - PROVIDÊNCIAS SOCIETÁRIAS','1.107 - ELABORAÇÃO DE PARECER','1.108 - ATIVIDADE NOTARIAL/REGISTRAL',
  '1.109 - ELABORAÇÃO/REVISÃO/RESPOSTA DE NOTIFICAÇÕES','1.110 - ARBITRAGEM','2.010 - ATUAÇÃO JUDICIAL PRESENCIAL/VIRTUAL','2.017 - ELABORAÇÃO/REVISÃO DE PETIÇÃO','2.018 - ANÁLISE DE PROCESSOS','2.021 - OUTRAS PROVIDÊNCIAS PROCESSUAIS/EXTRAJUDICIAIS'];
var OLD_ATIVS=['Reunião','Análise','Elaboração de documentos','Pesquisa','E-mails e ligações','Audiência / visita','Deslocamento','Administrativo','Outro'];
function empty(){return {v:2,clientes:[],projetos:[],ativs:ESP_ATIVS.slice(),lanc:[],ativo:null,jardim:[],cfg:{metaDia:8,arred:0,dias:[1,2,3,4,5],arvoreMin:25,tol:5}};}
function migrate(d){if(!d||!d.v)return null;var e=empty();Object.keys(e).forEach(function(k){if(d[k]==null)d[k]=e[k];});Object.keys(e.cfg).forEach(function(k){if(d.cfg[k]==null)d.cfg[k]=e.cfg[k];});
  if(d.v<2){if(JSON.stringify(d.ativs)===JSON.stringify(OLD_ATIVS))d.ativs=ESP_ATIVS.slice();d.v=2;}
  if(d.ativo&&!d.ativo.pausas){d.ativo.pausas=[];d.ativo.pausa=null;d.ativo.focoIni=d.ativo.inicio;}
  return d;}
var S=null,ui={sel:TODAY,f:{cliente:'',projeto:'',ativ:'',desc:'',fat:true},per:'semana',de:'',ate:'',fCli:''},R={v:'hoje',arg:''};
function cli(id){return S.clientes.find(function(c){return c.id===id;})||null;}
function proj(id){return S.projetos.find(function(p){return p.id===id;})||null;}
function cliNome(id){var c=cli(id);return c?c.nome:'Interno / sem cliente';}
function cliCor(id){var c=cli(id);return c?c.cor:'#94A3B8';}
function projNome(id){var p=proj(id);return p?(p.codigo?p.codigo+' · ':'')+p.nome:'';}
function lancTitulo(l){return cliNome(l.cliente)+(l.projeto?' · '+projNome(l.projeto):'');}
function valorDe(l){var c=cli(l.cliente);return l.fat&&c&&c.valor?l.min/60*c.valor:0;}
function doDia(d){return S.lanc.filter(function(l){return l.data===d;}).sort(function(a,b){return (a.ini||'99')<(b.ini||'99')?-1:1;});}
function somaMin(l){return l.reduce(function(a,x){return a+(x.min||0);},0);}
function ehUtil(d){return S.cfg.dias.indexOf(toD(d).getDay())>-1;}
function arred(min){var r=+S.cfg.arred||0;if(!r)return Math.max(1,Math.round(min));return Math.max(r,Math.ceil(Math.round(min)/r)*r);}

/* ---------- armazenamento: navegador + Firebase ---------- */
var LS_KEY='meu-timesheet-v1',APP_ID='timesheet';
var store={kind:'local'},cloud={uid:null,nome:'',unsub:null},statusTxt='Carregando…';
function setStatus(t){statusTxt=t;var el=document.getElementById('status');if(el)el.textContent=t;}
function readLocal(){try{var r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function writeLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));return true;}catch(e){return false;}}
function withTimeout(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error('timeout'));},ms);Promise.resolve(p).then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}
var saveTimer=null,saving=false,pending=false;
function save(){writeLocal();clearTimeout(saveTimer);saveTimer=setTimeout(flush,600);}
async function flush(){
  if(store.kind!=='cloud'||!cloud.uid){setStatus(writeLocal()?'Salvo neste aparelho':'Não foi possível salvar');return;}
  if(saving){pending=true;return;}
  saving=true;setStatus('Salvando…');
  try{await withTimeout(FB.save(cloud.uid,APP_ID,JSON.stringify(S)),15000);setStatus('Sincronizado com a sua conta');}
  catch(e){setStatus('Sem conexão: salvo neste aparelho');}
  saving=false;if(pending){pending=false;flush();}
}
function commit(){save();render();}
function isEmpty(d){return !d.lanc.length&&!d.clientes.length&&!d.ativo;}
function initCloud(){
  if(!window.FB)return;
  FB.onUser(function(u){
    if(cloud.unsub){cloud.unsub();cloud.unsub=null;}
    cloud.uid=u?u.uid:null;cloud.nome=u?(u.displayName||u.email||''):'';
    if(!u){store={kind:'local'};setStatus('Salvo neste aparelho');render();return;}
    setStatus('Conectando…');var first=true;
    cloud.unsub=FB.watch(u.uid,APP_ID,function(snap){
      if(snap.metadata.hasPendingWrites)return;
      var remote=null;if(snap.exists()){try{remote=migrate(JSON.parse((snap.data()||{}).estado));}catch(e){}}
      if(first){first=false;store={kind:'cloud'};if(remote){S=remote;writeLocal();}else if(!isEmpty(S))flush();setStatus('Sincronizado com a sua conta');render();return;}
      if(remote){S=remote;writeLocal();render();setStatus('Sincronizado com a sua conta');}
    },function(){store={kind:'local'};setStatus('Sem acesso à conta: salvo neste aparelho');});
  });
}

/* ---------- gráfico de barras (SVG) ---------- */
function niceScale(lo,hi){if(lo===hi){lo-=1;hi+=1;}var span=hi-lo,step=Math.pow(10,Math.floor(Math.log10(span/4)));var err=span/4/step;step*=err>=5?10:err>=2.5?5:err>=1.5?2:1;return {lo:Math.floor(lo/step)*step,hi:Math.ceil(hi/step)*step,step:step};}
// barras empilhadas: séries [{c, v:[...]}] em horas; meta: linha horizontal opcional
function barChart(labels,series,meta){
  var W=640,H=220,L=36,R=W-8,T=12,B=H-26,n=labels.length,tot=labels.map(function(_,i){return series.reduce(function(a,s){return a+(s.v[i]||0);},0);});
  var hi=Math.max.apply(null,tot.concat([meta||0,1])),sc=niceScale(0,hi);sc.lo=0;
  var Y=function(v){return T+(sc.hi-v)/(sc.hi-sc.lo)*(B-T);},gw=(R-L)/n,bw=Math.min(34,gw*0.62),X=function(i){return L+gw*i+gw/2;};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Horas por dia">';
  for(var v=0;v<=sc.hi+sc.step/2;v+=sc.step){var y=Y(v);s+='<line x1="'+L+'" x2="'+R+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-dasharray="3 4"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+NF1.format(v)+'h</text>';}

// jardim: cada sequência de trabalho sem pausa acima do mínimo vira uma árvore

    pausas:ls.reduce(function(s,l){return s+(l.pausas||0);},0),pausaMin:ls.reduce(function(s,l){return s+(l.pausaMin||0);},0)};}

    '<div class="stats"><div class="stat"><div class="l">Focado hoje</div><div class="v">'+hm(trab)+'</div></div><div class="stat"><div class="l">Maior sequência</div><div class="v">'+hm(Math.max(f.maior,seqAt))+'</div></div><div class="stat"><div class="l">Pausas</div><div class="v">'+(f.pausas+(a?(a.pausas||[]).length:0))+'</div></div><div class="stat"><div class="l">Tempo de pausa</div><div class="v">'+hm(f.pausaMin+(a?pausaSeg(a,now)/60:0))+'</div></div></div></section>';}

function periodo(){var t=TODAY,dom=addDays(t,-toD(t).getDay()),d=toD(t),ini,fim,nome;

  else if(ui.per==='mesPassado'){ini=ds(new Date(d.getFullYear(),d.getMonth()-1,1));fim=ds(new Date(d.getFullYear(),d.getMonth(),0));var pm=toD(ini);nome=MESES[pm.getMonth()]+' de '+pm.getFullYear();}
  else{ini=ui.de||addDays(t,-30);fim=ui.ate||t;nome=fmtDY(ini)+' a '+fmtDY(fim);}

function filtrados(p){return S.lanc.filter(function(l){return l.data>=p.ini&&l.data<=p.fim&&(!ui.fCli||(ui.fCli==='_'?!l.cliente:l.cliente===ui.fCli));}).sort(function(a,b){return a.data<b.data?-1:a.data>b.data?1:((a.ini||'')<(b.ini||'')?-1:1);});}
function agrupa(l,key,nome){var m={};l.forEach(function(x){var k=key(x);m[k]=m[k]||{k:k,nome:nome(x),min:0,fat:0,valor:0,cor:cliCor(x.cliente)};m[k].min+=x.min;if(x.fat)m[k].fat+=x.min;m[k].valor+=valorDe(x);});return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return b.min-a.min;});}

function pausaSeg(a,now){return (a.pausas||[]).reduce(function(s,p){return s+(p.fim-p.ini);},0)/1000+(a.pausa?(now-a.pausa.ini)/1000:0);}

function seqSeg(a,now){return a.pausa?0:Math.max(0,(now-(a.focoIni||a.inicio))/1000);}

  s+='<ellipse cx="60" cy="124" rx="34" ry="4" fill="rgba(0,0,0,.12)"/><path d="M34 96h52l-6 28H40z" fill="#C2410C"/><rect x="31" y="92" width="58" height="8" rx="3" fill="#EA580C"/><ellipse cx="60" cy="93" rx="26" ry="3" fill="#57290F"/>';
  var g='<g'+(mur?' transform="rotate(14 60 '+base+')"':'')+'>';
  if(min<5){g+='<ellipse cx="60" cy="'+(base-2)+'" rx="5" ry="3.5" fill="#92400E"/>'+(min>=1?'<path d="M60 '+(base-3)+'v-'+(min*1.5)+'" stroke="'+ver+'" stroke-width="2.5" stroke-linecap="round"/>':'');}
  else if(min<25){var top=base-h;g+='<path d="M60 '+base+'Q57 '+(base-h/2)+' 60 '+top+'" stroke="'+ver+'" stroke-width="3" fill="none" stroke-linecap="round"/>';
    var n=min<15?2:4;for(var i=0;i<n;i++){var y=top+6+i*(h-10)/Math.max(n,1),d=i%2?1:-1;g+='<path d="M60 '+y+'q'+(d*14)+' -10 '+(d*18)+' -2q'+(-d*8)+' 8 '+(-d*18)+' 2z" fill="'+(i%2?ver:ver2)+'"/>';}

    (min>=90&&!mur?'<circle cx="'+(cx-r*0.4)+'" cy="'+(top2)+'" r="3.5" fill="#EF4444"/><circle cx="'+(cx+r*0.35)+'" cy="'+(top2+r*0.3)+'" r="3.5" fill="#EF4444"/><circle cx="'+(cx+r*0.1)+'" cy="'+(top2-r*0.5)+'" r="3.5" fill="#EF4444"/>':'');}

form.addEventListener('submit',function(e){
  var rv=e.submitter?e.submitter.value:'ok';
  if(rv==='del'&&editId){if(confirm('Excluir este lançamento?')){S.lanc=S.lanc.filter(function(x){return x.id!==editId;});commit();}else e.preventDefault();return;}
  if(rv!=='ok')return;
  var fd=new FormData(form),ini=String(fd.get('ini')||''),fim=String(fd.get('fim')||''),min=0;
  // a duração vale mais que início/fim (no cronômetro, o intervalo inclui as pausas)
  min=parseDur(fd.get('dur'));if(!(min>0)&&ini&&fim){min=t2m(fim)-t2m(ini);if(min<0)min+=1440;}
  if(!(min>0)){e.preventDefault();alert('Informe a duração (ex.: 1:30) ou o horário de início e fim.');return;}
  if(!String(fd.get('desc')||'').trim()){e.preventDefault();alert('Escreva uma descrição: ela é obrigatória no time-sheet do Espaider.');return;}
  if(!fd.get('ativ')&&!confirm('Sem atividade. No Espaider a atividade é obrigatória. Salvar assim mesmo?')){e.preventDefault();return;}
  var antigo=editId?S.lanc.find(function(x){return x.id===editId;}):null,espV=fd.get('esp')?((antigo&&antigo.esp)||TODAY):'';
  var o={data:String(fd.get('data')||TODAY),ini:ini,fim:fim||(ini?m2t(t2m(ini)+min):''),min:Math.round(min),cliente:String(fd.get('cliente')||''),projeto:String(fd.get('projeto')||''),ativ:String(fd.get('ativ')||''),desc:String(fd.get('desc')||'').trim(),fat:!!fd.get('fat'),esp:espV};
  if(editId){Object.assign(S.lanc.find(function(x){return x.id===editId;}),o);}else{o.id=uid();S.lanc.push(o);}
  ui.sel=o.data;commit();
});

/* ---------- exportar ---------- */
function csvCell(v){v=String(v==null?'':v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportCSV(){var p=periodo(),l=filtrados(p);
  var rows=[['Data','Início','Fim','Horas (h:mm)','Horas (decimal)','Cliente','Projeto','Atividade','Descrição','Faturável','Valor (R$)']];
  l.forEach(function(x){rows.push([fmtDY(x.data),x.ini||'',x.fim||'',hhmm(x.min),dec(x.min),cliNome(x.cliente),x.projeto?projNome(x.projeto):'',x.ativ||'',x.desc||'',x.fat?'Sim':'Não',valorDe(x)?NF2.format(valorDe(x)):'']);});
  rows.push([]);rows.push(['Total','','',hhmm(somaMin(l)),dec(somaMin(l))]);
  var csv='﻿'+rows.map(function(r){return r.map(csvCell).join(';');}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='timesheet_'+p.ini+'_a_'+p.fim+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);}
function resumoTxt(){var p=periodo(),l=filtrados(p),tot=somaMin(l),fat=somaMin(l.filter(function(x){return x.fat;}));
  var t='Timesheet — '+p.nome+' ('+fmtDY(p.ini)+' a '+fmtDY(p.fim)+')\nTotal: '+hm(tot)+' · faturável: '+hm(fat)+'\n\n';
  agrupa(l,function(x){return x.cliente||'_';},function(x){return cliNome(x.cliente);}).forEach(function(r){t+='• '+r.nome+': '+hm(r.min)+'\n';});return t;}

/* ---------- cliques ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act],[data-theme-set]');if(!t)return;
  if(t.dataset.themeSet){setTheme(t.dataset.themeSet);return;}
  if(!S)return;var a=t.dataset.act;
  switch(a){
  case 'iniciar':iniciar(ui.f);return;
  case 'parar':parar();return;
  case 'pausar':pausar(+t.dataset.min||0);return;
  case 'retomar':retomar();return;
  case 'descartarTimer':if(confirm('Descartar o cronômetro sem salvar?')){S.ativo=null;commit();}return;
  case 'novoLanc':openLanc(null,t.dataset.d||(R.v==='semana'?ui.sel:TODAY));return;
  case 'editar':openLanc(t.dataset.id);return;
  case 'continuar':var lc=S.lanc.find(function(x){return x.id===t.dataset.id;});if(!lc)return;if(S.ativo){alert('Já tem um cronômetro ligado. Pare ele primeiro.');return;}iniciar(lc);location.hash='hoje';return;
  case 'selDia':ui.sel=t.dataset.d;render();return;
  case 'wkPrev':ui.sel=addDays(ui.sel,-7);render();return;
  case 'wkNext':ui.sel=addDays(ui.sel,7);render();return;
  case 'selHoje':ui.sel=TODAY;render();return;
  case 'per':ui.per=t.dataset.k;render();return;
  case 'csv':exportCSV();return;
  case 'copiarEsp':var pe=filtrados(periodo()).filter(function(x){return !x.esp;}),tx='Lançar no Espaider ('+pe.length+'):\n'+pe.map(function(x,i){return (i+1)+') '+fmtDY(x.data)+' | Cliente: '+cliNome(x.cliente)+' | Caso: '+(x.projeto?projNome(x.projeto):'—')+' | Atividade: '+(x.ativ||'—')+' | Horas: '+dec(x.min)+' ('+hhmm(x.min)+') | Descrição: '+(x.desc||'—');}).join('\n');
    (navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).then(function(){alert('Lista copiada. Cole no chat do Claude.');},function(){prompt('Copie a lista:',tx);});return;
  case 'marcarEsp':var pm=filtrados(periodo()).filter(function(x){return !x.esp;});if(pm.length&&confirm('Marcar '+pm.length+' lançamento(s) deste período como já lançados no Espaider?')){pm.forEach(function(x){x.esp=TODAY;});commit();}return;
  case 'ativsEsp':if(confirm('Trocar a lista de atividades pelas 17 do Espaider? Os lançamentos já feitos não mudam.')){S.ativs=ESP_ATIVS.slice();commit();}return;
  case 'copiar':var txt=resumoTxt();(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){alert('Resumo copiado. Cole no e-mail ou no WhatsApp.');},function(){prompt('Copie o resumo:',txt);});return;
  case 'imprimir':window.print();return;
  case 'novoCli':S.clientes.push({id:uid(),nome:'Novo cliente',cor:CORES[S.clientes.length%CORES.length],valor:0});commit();setTimeout(function(){var r=document.querySelectorAll('[data-cid] input[data-cf=nome]');if(r.length){r[r.length-1].focus();r[r.length-1].select();}},0);return;
  case 'delCli':var cid=t.closest('[data-cid]').dataset.cid,n=S.lanc.filter(function(x){return x.cliente===cid;}).length;
    if(confirm('Excluir o cliente '+cliNome(cid)+'?'+(n?' Os '+n+' lançamentos dele passam a aparecer como “Interno”.':''))){S.clientes=S.clientes.filter(function(c){return c.id!==cid;});S.lanc.forEach(function(x){if(x.cliente===cid){x.cliente='';x.projeto='';}});S.projetos.forEach(function(p){if(p.cliente===cid)p.cliente='';});commit();}return;
  case 'novoProj':S.projetos.push({id:uid(),nome:'Novo projeto',codigo:'',cliente:S.clientes.length===1?S.clientes[0].id:''});commit();setTimeout(function(){var r=document.querySelectorAll('[data-pid] input[data-pf=nome]');if(r.length){r[r.length-1].focus();r[r.length-1].select();}},0);return;
  case 'delProj':var pid=t.closest('[data-pid]').dataset.pid;if(confirm('Excluir este projeto? Os lançamentos continuam, sem projeto.')){S.projetos=S.projetos.filter(function(p){return p.id!==pid;});S.lanc.forEach(function(x){if(x.projeto===pid)x.projeto='';});commit();}return;
  case 'addAtiv':var na=document.getElementById('novaAtiv').value.trim();if(na&&S.ativs.indexOf(na)<0){S.ativs.push(na);commit();refocus('novaAtiv');}return;
  case 'delAtiv':S.ativs.splice(+t.dataset.i,1);commit();return;
  case 'dia':var dd=+t.dataset.d,ix=S.cfg.dias.indexOf(dd);if(ix>-1)S.cfg.dias.splice(ix,1);else S.cfg.dias.push(dd);commit();return;
  case 'entrar':if(semPopup()){alert('Aqui o login do Google não consegue abrir. Use e-mail e senha, ou abra pelo Safari/Chrome.');return;}
    FB.signIn().catch(function(err){var c=err&&err.code||'';if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return;alert(c==='auth/popup-blocked'?'O navegador bloqueou a janela de login. Permita pop-ups e tente de novo.':errAuth(err));});return;
  case 'entrarEmail':var em=document.getElementById('lgEmail').value.trim(),pw=document.getElementById('lgSenha').value;if(!em||!pw){alert('Preencha e-mail e senha.');return;}FB.signInEmail(em,pw).catch(function(err){alert(errAuth(err));});return;
  case 'esqueci':var em2=document.getElementById('lgEmail').value.trim();if(!em2){alert('Digite seu e-mail no campo acima.');return;}FB.resetSenha(em2).then(function(){alert('Se existir uma conta com senha para '+em2+', chegou um e-mail para criar uma nova senha.');},function(err){alert(errAuth(err));});return;
  case 'criarSenha':var ns=document.getElementById('novaSenha').value;if(ns.length<6){alert('A senha precisa ter pelo menos 6 caracteres.');return;}FB.criarSenha(ns).then(function(){alert('Senha criada!');render();},function(err){alert(errAuth(err));});return;
  case 'sair':if(confirm('Sair da conta? Seus dados continuam salvos nela.'))FB.signOut();return;
  }
});
function errAuth(e){var c=e&&e.code||'';return ({'auth/invalid-credential':'E-mail ou senha incorretos. Se você sempre entrou com o Google, crie a senha primeiro (entrando com o Google no Safari ou no computador).','auth/invalid-email':'E-mail inválido.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.','auth/too-many-requests':'Muitas tentativas. Espere alguns minutos.','auth/requires-recent-login':'Por segurança, saia e entre de novo com o Google, depois crie a senha.','auth/provider-already-linked':'Essa conta já tem senha.','auth/network-request-failed':'Sem internet.'})[c]||('Não foi possível ('+(c||'erro')+').');}

/* ---------- campos ---------- */
document.addEventListener('change',function(e){
  var t=e.target;if(!S)return;
  if(t.dataset.ff){var k=t.dataset.ff;ui.f[k]=t.type==='checkbox'?t.checked:t.value;if(k==='cliente'){ui.f.projeto='';render();}return;}
  if(t.dataset.at){if(S.ativo){S.ativo[t.dataset.at]=t.value;save();}return;}
  if(t.dataset.rel){ui[t.dataset.rel]=t.value;render();return;}
  if(t.dataset.cfg){S.cfg[t.dataset.cfg]=pnum(t.value);commit();return;}
  if(t.dataset.cf){var c=cli(t.closest('[data-cid]').dataset.cid),f=t.dataset.cf;c[f]=f==='valor'?pnum(t.value):(t.value.trim()||c[f]);commit();return;}
  if(t.dataset.pf){var p=proj(t.closest('[data-pid]').dataset.pid),g=t.dataset.pf;p[g]=g==='nome'?(t.value.trim()||p.nome):t.value.trim();commit();return;}
});
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.ff==='desc')ui.f.desc=t.value;if(t.dataset&&t.dataset.at&&S.ativo){S.ativo[t.dataset.at]=t.value;writeLocal();}});

/* ---------- tema ---------- */
function setTheme(t){if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('ts-theme',t);}catch(e){}markTheme();}
function markTheme(){var a=document.documentElement.getAttribute('data-theme')||'auto';document.querySelectorAll('[data-theme-set]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.themeSet===a);});}
try{var th=localStorage.getItem('ts-theme');if(th&&th!=='auto')document.documentElement.setAttribute('data-theme',th);}catch(e){}

/* ---------- início ---------- */
S=migrate(readLocal())||empty();
route();setStatus('Salvo neste aparelho');
if(window.FB)initCloud();else window.addEventListener('fb-ready',initCloud);
})();
