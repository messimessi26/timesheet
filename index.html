<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<title>Meu Timesheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7;--card:#FFFFFF;--text:#111827;--muted:#6B7280;--line:#E5E7EB;--soft:#EEF0F3;
  --acc:#4338CA;--accText:#4338CA;--ok:#16A34A;--warn:#C2410C;--fat:#4338CA;--nfat:#94A3B8;
  --tab:#2B2F36;--tabText:#C9CDD3;--shadow:0 6px 18px rgba(17,24,39,.10);color-scheme:light;
  --st0:#64748B;--st2:#B45309;--red:#DC2626;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1013;--card:#171A1F;--text:#ECEEF1;--muted:#9AA1AC;--line:#2A2F37;--soft:#1F232A;
  --acc:#818CF8;--accText:#A5B4FC;--ok:#4ADE80;--warn:#FB923C;--fat:#818CF8;--nfat:#64748B;
  --tab:#22262D;--tabText:#AEB4BE;--shadow:none;color-scheme:dark;--st0:#94A3B8;--st2:#FBBF24;--red:#F87171;}}
:root[data-theme="dark"]{
  --bg:#0E1013;--card:#171A1F;--text:#ECEEF1;--muted:#9AA1AC;--line:#2A2F37;--soft:#1F232A;
  --acc:#818CF8;--accText:#A5B4FC;--ok:#4ADE80;--warn:#FB923C;--fat:#818CF8;--nfat:#64748B;
  --tab:#22262D;--tabText:#AEB4BE;--shadow:none;color-scheme:dark;--st0:#94A3B8;--st2:#FBBF24;--red:#F87171;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--accText)}
.app{max-width:820px;margin:0 auto;padding:12px 14px 110px}
.small{font-size:12px;color:var(--muted)}
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 2px 12px;gap:8px}
.hdr h1{margin:0;font-size:19px;font-weight:600;text-align:center}
.hdr .r{justify-self:end}
.card{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0;font-size:15px;font-weight:700}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:14px;font-weight:600;padding:9px 14px;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:42px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.stop{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:14px;font-weight:600;color:var(--muted)}
.clock{font-size:46px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--acc)}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;display:flex}
.bar>div{height:100%}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--soft);font-size:14px}
.list li:last-child{border-bottom:0}
.list .n{flex:1;min-width:0}
.list .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .n span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .v{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.dotc{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ib{border:0;background:transparent;width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted)}
.ib svg{stroke:currentColor}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600}
.field .hint{font-weight:400;color:var(--muted);font-size:11px}
.in,.field input,.field select,.field textarea,td input,td select{width:100%;height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px;font-size:15px}
.field textarea{height:auto;min-height:64px;padding:10px 12px}
.num{text-align:right}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--soft);border-radius:14px;padding:10px 12px}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:18px;font-weight:700;margin-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:inherit;fill:var(--muted);font-size:12px}
.keys{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.keys i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.tablewrap{overflow-x:auto;position:relative}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;font-weight:600;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px;border-bottom:1px solid var(--soft);vertical-align:middle}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px;padding:4px 0}
.preview{font-size:13px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;text-align:center;border:0;background:transparent;border-radius:10px;padding:9px 6px;font-size:14px;font-weight:600;color:var(--muted)}
.seg [aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.wknav{display:flex;align-items:center;gap:6px;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);text-transform:capitalize}
.wknav span{flex:1;text-align:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px;padding:2px 0 6px}
.week button{border:0;background:transparent;border-radius:14px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
.week span{font-size:12px;color:var(--muted)}
.week b{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;font-size:17px;font-weight:500;color:var(--muted)}
.week .today b{color:var(--text);font-weight:800}
.week .sel b{background:var(--text);color:var(--bg);font-weight:800}
.week em{font-style:normal;font-size:11px;font-weight:700;color:var(--accText);min-height:14px;font-variant-numeric:tabular-nums}
.focus{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.plantbox{background:linear-gradient(180deg,var(--soft) 0%,var(--card) 100%);border-radius:20px;padding:8px 14px 0;display:flex;justify-content:center}
.ftext{flex:1;min-width:180px}
.garden{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end}
.garden span{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--muted)}
.runbar{display:flex;align-items:center;gap:10px;background:var(--acc);color:#fff;border-radius:16px;padding:10px 14px;margin-bottom:14px;text-decoration:none}
.runbar b{font-variant-numeric:tabular-nums}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(580px,calc(100% - 24px));background:var(--tab);border-radius:999px;display:flex;justify-content:space-around;padding:8px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--tabText);text-decoration:none;font-size:10px;border-radius:999px;padding:8px 0}
.tabbar a svg{stroke:var(--tabText)}
.tabbar a[aria-current="page"]{background:rgba(255,255,255,.14);color:#fff}
.tabbar a[aria-current="page"] svg{stroke:#fff}
dialog{border:0;border-radius:22px;padding:0;background:var(--card);color:var(--text);width:min(500px,calc(100% - 20px));box-shadow:0 20px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:12px}
dialog .row{display:flex;gap:10px}
dialog .row>*{flex:1;min-width:0}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.welcome{background:var(--card);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.welcome h2{margin:0;font-size:22px}
.welcome p{margin:0;color:var(--muted);line-height:1.5}
/* visual */
.ring{position:relative;flex-shrink:0}
.ring svg{display:block}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15}
.ring .c b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .c span{font-size:11px;color:var(--muted);font-weight:600}
.legend{display:flex;flex-direction:column;gap:7px;font-size:13px;flex:1;min-width:170px}
.legend div{display:flex;align-items:center;gap:8px}
.legend span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend b{font-variant-numeric:tabular-nums}
.dayline{position:relative;height:30px;background:var(--soft);border-radius:10px;overflow:hidden}
.dayline i{position:absolute;top:5px;bottom:5px;border-radius:6px;min-width:4px}
.dayline i.live{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 6px,transparent 6px 12px)}
.dayline .now{position:absolute;top:0;bottom:0;width:2px;background:var(--warn)}
.ticks{position:relative;height:16px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
.ticks span{position:absolute;transform:translateX(-50%)}
.stripe{width:4px;align-self:stretch;border-radius:3px;flex-shrink:0}
.pbar{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--soft);vertical-align:middle;margin-right:6px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px}
.tabbar a{position:relative}
.badge{position:absolute;top:3px;left:calc(50% + 5px);background:#EF4444;color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* radar de demandas */
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap;border:0;font-variant-numeric:tabular-nums}
.tag.red{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.tag.amb{background:color-mix(in srgb,var(--st2) 16%,transparent);color:var(--st2)}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag.acc{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--accText)}
.board{display:grid;gap:16px;margin-bottom:14px}
@media (min-width:760px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.colh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:0 2px}
.colh em{font-style:normal;margin-left:auto;background:var(--soft);color:var(--muted);border-radius:999px;padding:2px 8px;font-size:12px}
.dem{display:flex;background:var(--card);border:0;border-radius:16px;overflow:hidden;text-align:left;width:100%;padding:0;box-shadow:var(--shadow);outline-offset:2px}
.dem:hover{filter:brightness(.98)}
.dem>i{width:5px;flex-shrink:0}
.dem .b{flex:1;min-width:0;padding:11px 12px;display:flex;flex-direction:column;gap:7px}
.dem .t{font-weight:700;font-size:14.5px;line-height:1.3}
.dem .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dem .q{font-size:12px;color:var(--text);opacity:.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.steps{display:flex;gap:3px}
.steps span{flex:1;height:5px;border-radius:3px;background:var(--soft)}
.arow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:9px 0;border-bottom:1px solid var(--soft)}
.arow:last-child{border-bottom:0}
.arow .n{flex:1;min-width:0}
.arow .n b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .n span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dchip{display:inline-flex;align-items:center;gap:7px;max-width:100%}
.dchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
dialog.wide{width:min(620px,calc(100% - 20px));max-height:calc(100dvh - 30px)}
.dbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
.dhead{display:flex;align-items:center;gap:10px}
.dhead>i{width:6px;align-self:stretch;border-radius:3px;flex-shrink:0}
.dhead input{flex:1;min-width:0;border:0;background:transparent;font-size:18px;font-weight:700;padding:6px 0;border-bottom:1.5px dashed var(--line);border-radius:0}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;position:relative}
.stepper button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 2px;position:relative;z-index:1;line-height:1.2}
.stepper button b{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);border:2px solid var(--line);font-size:13px;color:var(--muted)}
.stepper button.done b{background:var(--sc);border-color:var(--sc);color:#fff}
.stepper button[aria-pressed="true"]{color:var(--text)}
.stepper button[aria-pressed="true"] b{box-shadow:0 0 0 4px color-mix(in srgb,var(--sc) 25%,transparent)}
.stepper .track{position:absolute;left:12.5%;right:12.5%;top:19px;height:2px;background:var(--line)}
.stepper .track i{display:block;height:100%;background:var(--sc)}
.timeline{list-style:none;margin:0;padding:0 0 0 12px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.timeline li{position:relative;padding-left:12px;font-size:13.5px;line-height:1.4;display:flex;gap:8px;align-items:flex-start}
.timeline li:before{content:"";position:absolute;left:-19px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2.5px solid var(--c,var(--muted))}
.timeline li .tx{flex:1;min-width:0}
.timeline li .tx small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.timeline li.st .tx{color:var(--c);font-weight:700}
.addnote{display:flex;gap:8px}
.addnote input{flex:1;min-width:0}
@media print{.tabbar,.noprint,.runbar{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}.app{padding:0}}
</style>
</head>
<body>
<div class="app"><div id="view"></div></div>
<nav class="tabbar" id="tabbar" aria-label="Menu"></nav>
<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<dialog id="dlgD" class="wide" aria-label="Demanda"><div id="dlgDB" class="dbody"></div></dialog>
<datalist id="dlDesc"></datalist>

<script>
(function(){
'use strict';
/* ---------- utilidades ---------- */
var DOW=['dom','seg','ter','qua','qui','sex','sáb'],DOWL=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var CORES=['#4338CA','#0F766E','#B45309','#BE185D','#2563EB','#047857','#7C3AED','#C2410C','#475569','#9F1239'];
function uid(){return Math.random().toString(36).slice(2,10);}
function pad(n){return String(n).padStart(2,'0');}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function toD(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=toD(s);d.setDate(d.getDate()+n);return ds(d);}
function today(){return ds(new Date());}
var TODAY=today();
function fmtD(s,long){var d=toD(s);return (long?DOWL[d.getDay()]+', ':'')+pad(d.getDate())+'/'+pad(d.getMonth()+1);}
function fmtDY(s){return fmtD(s)+'/'+String(s).slice(0,4);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pnum(s){s=String(s==null?'':s).trim().replace(/\s/g,'');if(s.indexOf(',')>-1)s=s.replace(/\./g,'').replace(',','.');var n=parseFloat(s);return isFinite(n)?n:0;}
var NF2=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}),NF1=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1});
function brl(n){return 'R$ '+NF2.format(n||0);}
function hm(min){min=Math.round(min||0);return Math.floor(min/60)+'h'+pad(min%60);}          // 1h30
function hhmm(min){min=Math.round(min||0);return Math.floor(min/60)+':'+pad(min%60);}       // 1:30
function dec(min){return NF2.format((min||0)/60);}                                           // 1,50
function hms(sec){sec=Math.max(0,Math.floor(sec));return pad(Math.floor(sec/3600))+':'+pad(Math.floor(sec%3600/60))+':'+pad(sec%60);}
function t2m(t){if(!t)return null;var p=String(t).split(':');return (+p[0])*60+(+p[1]||0);}
function m2t(m){m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60);}
function nowT(d){d=d||new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
// "1:30", "1h30", "1,5", "90m", "90" (minutos se >= 15 e sem separador? não: número puro = horas)
function parseDur(s){s=String(s||'').trim().toLowerCase().replace(/\s/g,'');if(!s)return 0;var m;
  if((m=/^(\d+):(\d{1,2})$/.exec(s)))return +m[1]*60+(+m[2]);
  if((m=/^(\d+)h(\d{1,2})?m?(in)?$/.exec(s)))return +m[1]*60+(+(m[2]||0));
  if((m=/^(\d+)m(in)?$/.exec(s)))return +m[1];
  return Math.round(pnum(s)*60);}
var TRASH='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
var PEN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>';
var PLAY='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>';
var LEFT='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
var RIGHT='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

/* ---------- estado ---------- */
// atividades do time-sheet do Espaider (Gerson Branco Advogados), com o código usado lá
var ESP_ATIVS=['1.003 - ATENDIMENTO AO CLIENTE','1.004 - REUNIÃO','1.005 - DEFESA ADMINISTRATIVA','1.101 - ELABORAÇÃO/ANALISE/REVISÃO DE CONTRATOS','1.102 - PROVIDÊNCIAS COM TERCEIROS','1.103 - REUNIÃO INTERNA',
  '1.104 - PROVIDÊNCIAS ADMINISTRATIVAS','1.105 - ELABORAÇÃO/REVISÃO DE ATOS SOCIETÁRIOS','1.106 - PROVIDÊNCIAS SOCIETÁRIAS','1.107 - ELABORAÇÃO DE PARECER','1.108 - ATIVIDADE NOTARIAL/REGISTRAL',
  '1.109 - ELABORAÇÃO/REVISÃO/RESPOSTA DE NOTIFICAÇÕES','1.110 - ARBITRAGEM','2.010 - ATUAÇÃO JUDICIAL PRESENCIAL/VIRTUAL','2.017 - ELABORAÇÃO/REVISÃO DE PETIÇÃO','2.018 - ANÁLISE DE PROCESSOS','2.021 - OUTRAS PROVIDÊNCIAS PROCESSUAIS/EXTRAJUDICIAIS'];
var OLD_ATIVS=['Reunião','Análise','Elaboração de documentos','Pesquisa','E-mails e ligações','Audiência / visita','Deslocamento','Administrativo','Outro'];
function empty(){return {v:2,clientes:[],projetos:[],ativs:ESP_ATIVS.slice(),lanc:[],ativo:null,jardim:[],dem:[],cfg:{metaDia:8,arred:0,dias:[1,2,3,4,5],arvoreMin:25,tol:5}};}
function migrate(d){if(!d||!d.v)return null;var e=empty();Object.keys(e).forEach(function(k){if(d[k]==null)d[k]=e[k];});Object.keys(e.cfg).forEach(function(k){if(d.cfg[k]==null)d.cfg[k]=e.cfg[k];});
  if(d.v<2){if(JSON.stringify(d.ativs)===JSON.stringify(OLD_ATIVS))d.ativs=ESP_ATIVS.slice();d.v=2;}
  if(d.ativo&&!d.ativo.pausas){d.ativo.pausas=[];d.ativo.pausa=null;d.ativo.focoIni=d.ativo.inicio;}
  return d;}
var S=null,ui={sel:TODAY,f:{cliente:'',projeto:'',ativ:'',desc:'',fat:true,dem:''},per:'semana',de:'',ate:'',fCli:'',rCli:'',verConc:false},R={v:'hoje',arg:''};
function cli(id){return S.clientes.find(function(c){return c.id===id;})||null;}
function proj(id){return S.projetos.find(function(p){return p.id===id;})||null;}
function cliNome(id){var c=cli(id);return c?c.nome:'Interno / sem cliente';}
function cliCor(id){var c=cli(id);return c?c.cor:'#94A3B8';}
function projNome(id){var p=proj(id);return p?(p.codigo?p.codigo+' · ':'')+p.nome:'';}
function lancTitulo(l){return cliNome(l.cliente)+(l.projeto?' · '+projNome(l.projeto):'');}
function valorDe(l){var c=cli(l.cliente);return l.fat&&c&&c.valor?l.min/60*c.valor:0;}
function doDia(d){return S.lanc.filter(function(l){return l.data===d;}).sort(function(a,b){return (a.ini||'99')<(b.ini||'99')?-1:1;});}
function somaMin(l){return l.reduce(function(a,x){return a+(x.min||0);},0);}
function ehUtil(d){return S.cfg.dias.indexOf(toD(d).getDay())>-1;}
function arred(min){var r=+S.cfg.arred||0;if(!r)return Math.max(1,Math.round(min));return Math.max(r,Math.ceil(Math.round(min)/r)*r);}

/* ---------- demandas: o que está em andamento e o que foi enviado e precisa de retorno ---------- */
var STS=[['fazer','A fazer','var(--st0)'],['andamento','Em andamento','var(--acc)'],['enviado','Aguardando retorno','var(--st2)'],['concluido','Concluída','var(--ok)']];
var PRIO=[['alta','Alta'],['normal','Normal'],['baixa','Baixa']];
function stI(k){for(var i=0;i<STS.length;i++)if(STS[i][0]===k)return {i:i,k:k,nome:STS[i][1],cor:STS[i][2]};return {i:1,k:'andamento',nome:STS[1][1],cor:STS[1][2]};}
function demById(id){return id?((S.dem||[]).find(function(d){return d.id===id;})||null):null;}
function demTit(id){var d=demById(id);return d?(d.titulo||'Sem título'):'';}
function diasAte(d){return Math.round((toD(d)-toD(TODAY))/864e5);}
function demMin(id){var m=somaMin(S.lanc.filter(function(l){return l.dem===id;}));if(S.ativo&&S.ativo.dem===id)m+=trabSeg(S.ativo,Date.now())/60;return m;}
function ultimaMov(d){var u=d.criado||'';(d.hist||[]).forEach(function(h){if(h.d>u)u=h.d;});S.lanc.forEach(function(l){if(l.dem===d.id&&l.data>u)u=l.data;});return u||TODAY;}
function demAtivas(){var o={andamento:0,fazer:1,enviado:2},p={alta:0,normal:1,baixa:2};
  return (S.dem||[]).filter(function(d){return d.status!=='concluido';}).sort(function(a,b){return (o[a.status]-o[b.status])||(p[a.prio||'normal']-p[b.prio||'normal'])||((a.prazo||'9')<(b.prazo||'9')?-1:(a.prazo||'9')>(b.prazo||'9')?1:0);});}
// o que precisa de atenção: prazo vencendo, retorno a cobrar, demanda parada
function alertas(d){var a=[];if(d.status==='concluido')return a;
  if(d.status==='enviado'){var env=d.enviadoEm?-diasAte(d.enviadoEm):0;if(d.follow&&d.follow<=TODAY)a.push({n:'amb',t:'Cobrar retorno'+(env>0?' · enviado há '+env+' d':'')});return a;}
  if(d.prazo){var x=diasAte(d.prazo);if(x<0)a.push({n:'red',t:'Prazo vencido há '+(-x)+' d',p:1});else if(x===0)a.push({n:'red',t:'Vence hoje',p:1});else if(x===1)a.push({n:'amb',t:'Vence amanhã',p:1});}
  if(d.follow&&d.follow<=TODAY)a.push({n:'amb',t:'Revisar hoje'});
  if(d.status==='andamento'){var pa=-diasAte(ultimaMov(d));if(pa>=7)a.push({n:'amb',t:'Parada há '+pa+' d'});}
  return a;}
function radarAlertas(){var r=[];demAtivas().forEach(function(d){var a=alertas(d);if(a.length)r.push({d:d,a:a,red:a.some(function(x){return x.n==='red';})});});return r.sort(function(x,y){return (y.red?1:0)-(x.red?1:0);});}
function setSt(d,k,nota){if(!d||d.status===k)return;var antes=d.status;d.status=k;d.hist=d.hist||[];
  if(k==='enviado'){d.enviadoEm=TODAY;if(!d.follow||d.follow<=TODAY)d.follow=addDays(TODAY,7);}
  else if(antes==='enviado'||k==='concluido')d.follow='';
  d.concluidoEm=k==='concluido'?TODAY:'';
  d.hist.push({d:TODAY,k:'st',s:k,t:nota||stI(k).nome});}
function steps(i,cor){var h='<span class="steps" aria-hidden="true">';for(var k=0;k<4;k++)h+='<span'+(k<=i?' style="background:'+cor+'"':'')+'></span>';return h+'</span>';}
function demTags(d){var t=[],al=alertas(d);
  if(d.prio==='alta'&&d.status!=='concluido')t.push('<span class="tag red">▲ Alta</span>');
  al.forEach(function(a){t.push('<span class="tag '+a.n+'">'+esc(a.t)+'</span>');});
  if(d.prazo&&d.status!=='concluido'&&d.status!=='enviado'&&!al.some(function(a){return a.p;}))t.push('<span class="tag">Prazo '+fmtD(d.prazo)+'</span>');
  if(d.status==='enviado'&&d.follow&&d.follow>TODAY)t.push('<span class="tag amb">Cobrar em '+fmtD(d.follow)+'</span>');
  if(d.status==='enviado'&&d.enviadoEm)t.push('<span class="tag">Enviado '+fmtD(d.enviadoEm)+(d.para?' p/ '+esc(d.para):'')+'</span>');
  if(d.status==='concluido'&&d.concluidoEm)t.push('<span class="tag ok">✓ '+fmtD(d.concluidoEm)+'</span>');
  var m=demMin(d.id);if(m)t.push('<span class="tag acc">⏱ '+hm(m)+'</span>');
  return t.join('');}
function demCard(d){var s=stI(d.status),notas=(d.hist||[]).filter(function(h){return h.k==='nota';}),last=notas[notas.length-1];
  return '<button class="dem" data-act="abrirDem" data-id="'+d.id+'"><i style="background:'+cliCor(d.cliente)+'"></i><span class="b"><span class="t">'+esc(d.titulo||'Sem título')+'</span><span class="s">'+esc(cliNome(d.cliente)+(d.projeto?' · '+projNome(d.projeto):''))+'</span>'+
    steps(s.i,s.cor)+(last?'<span class="q">'+fmtD(last.d)+': '+esc(last.t)+'</span>':'')+'<span class="tags">'+demTags(d)+'</span></span></button>';}
function demOptions(sel){var l=demAtivas();if(sel&&!l.some(function(d){return d.id===sel;})){var x=demById(sel);if(x)l.push(x);}
  return '<option value="">Sem demanda</option>'+l.map(function(d){return '<option value="'+d.id+'"'+(d.id===sel?' selected':'')+'>'+esc((d.titulo||'Sem título')+(d.cliente?' · '+cliNome(d.cliente):''))+'</option>';}).join('');}

/* ---------- armazenamento: navegador + Firebase ---------- */
var LS_KEY='meu-timesheet-v1',APP_ID='timesheet';
var store={kind:'local'},cloud={uid:null,nome:'',unsub:null},statusTxt='Carregando…';
function setStatus(t){statusTxt=t;var el=document.getElementById('status');if(el)el.textContent=t;}
function readLocal(){try{var r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function writeLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));return true;}catch(e){return false;}}
function withTimeout(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error('timeout'));},ms);Promise.resolve(p).then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}
var saveTimer=null,saving=false,pending=false;
function save(){writeLocal();clearTimeout(saveTimer);saveTimer=setTimeout(flush,600);}
async function flush(){
  if(store.kind!=='cloud'||!cloud.uid){setStatus(writeLocal()?'Salvo neste aparelho':'Não foi possível salvar');return;}
  if(saving){pending=true;return;}
  saving=true;setStatus('Salvando…');
  try{await withTimeout(FB.save(cloud.uid,APP_ID,JSON.stringify(S)),15000);setStatus('Sincronizado com a sua conta');}
  catch(e){setStatus('Sem conexão: salvo neste aparelho');}
  saving=false;if(pending){pending=false;flush();}
}
function commit(){save();render();}
function isEmpty(d){return !d.lanc.length&&!d.clientes.length&&!d.ativo&&!(d.dem||[]).length;}
function initCloud(){
  if(!window.FB)return;
  FB.onUser(function(u){
    if(cloud.unsub){cloud.unsub();cloud.unsub=null;}
    cloud.uid=u?u.uid:null;cloud.nome=u?(u.displayName||u.email||''):'';
    if(!u){store={kind:'local'};setStatus('Salvo neste aparelho');render();return;}
    setStatus('Conectando…');var first=true;
    cloud.unsub=FB.watch(u.uid,APP_ID,function(snap){
      if(snap.metadata.hasPendingWrites)return;
      var remote=null;if(snap.exists()){try{remote=migrate(JSON.parse((snap.data()||{}).estado));}catch(e){}}
      if(first){first=false;store={kind:'cloud'};if(remote){S=remote;writeLocal();}else if(!isEmpty(S))flush();setStatus('Sincronizado com a sua conta');render();return;}
      if(remote){S=remote;writeLocal();render();setStatus('Sincronizado com a sua conta');}
    },function(){store={kind:'local'};setStatus('Sem acesso à conta: salvo neste aparelho');});
  });
}

/* ---------- gráfico de barras (SVG) ---------- */
function niceScale(lo,hi){if(lo===hi){lo-=1;hi+=1;}var span=hi-lo,step=Math.pow(10,Math.floor(Math.log10(span/4)));var err=span/4/step;step*=err>=5?10:err>=2.5?5:err>=1.5?2:1;return {lo:Math.floor(lo/step)*step,hi:Math.ceil(hi/step)*step,step:step};}
// barras empilhadas: séries [{c, v:[...]}] em horas; meta: linha horizontal opcional
function barChart(labels,series,meta){
  var W=640,H=220,L=36,R=W-8,T=12,B=H-26,n=labels.length,tot=labels.map(function(_,i){return series.reduce(function(a,s){return a+(s.v[i]||0);},0);});
  var hi=Math.max.apply(null,tot.concat([meta||0,1])),sc=niceScale(0,hi);sc.lo=0;
  var Y=function(v){return T+(sc.hi-v)/(sc.hi-sc.lo)*(B-T);},gw=(R-L)/n,bw=Math.min(34,gw*0.62),X=function(i){return L+gw*i+gw/2;};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Horas por dia">';
  for(var v=0;v<=sc.hi+sc.step/2;v+=sc.step){var y=Y(v);s+='<line x1="'+L+'" x2="'+R+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-dasharray="3 4"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+NF1.format(v)+'h</text>';}
  labels.forEach(function(l,i){var y0=Y(0);series.forEach(function(se){var h=se.v[i]||0;if(h<=0)return;var y1=Y(h)-(Y(0)-y0);s+='<rect x="'+(X(i)-bw/2)+'" y="'+y1+'" width="'+bw+'" height="'+(y0-y1)+'" fill="'+se.c+'"'+(y0===Y(0)?'':'')+'><title>'+esc(l)+(se.n?' · '+esc(se.n):'')+': '+hm(h*60)+'</title></rect>';y0=y1;});
    var every=Math.ceil(n/12);if(i%every===0||i===n-1)s+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(l)+'</text>';});
  if(meta)s+='<line x1="'+L+'" x2="'+R+'" y1="'+Y(meta)+'" y2="'+Y(meta)+'" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="6 4"/>';
  return '<div class="chart">'+s+'</svg></div>';}
// anel colorido por cliente: segs [{min,cor,nome}]; base = meta (ou o total)
function ring(segs,tot,meta,px,sub){px=px||132;var r=50,C=2*Math.PI*r,base=Math.max(meta||0,tot,1),off=0;
  var s='<svg viewBox="0 0 120 120" width="'+px+'" height="'+px+'" aria-hidden="true"><circle cx="60" cy="60" r="'+r+'" fill="none" stroke="var(--soft)" stroke-width="13"/>';
  segs.forEach(function(g){var len=g.min/base*C;if(len<=0)return;s+='<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+g.cor+'" stroke-width="13" stroke-dasharray="'+Math.max(len-(segs.length>1?1.5:0),0.8)+' '+C+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 60 60)"><title>'+esc(g.nome)+': '+hm(g.min)+'</title></circle>';off+=len;});
  if(sub==null)sub=meta?(tot>=meta?'meta batida ✓':Math.round(tot/meta*100)+'% da meta'):'no total';
  return '<div class="ring" role="img" aria-label="'+hm(tot)+', '+esc(sub)+'">'+s+'</svg><div class="c"><b>'+hm(tot)+'</b><span>'+esc(sub)+'</span></div></div>';}
function legenda(rows){return '<div class="legend">'+rows.slice(0,6).map(function(r){return '<div><i class="dotc" style="background:'+r.cor+'"></i><span>'+esc(r.nome)+'</span><b>'+hm(r.min)+'</b></div>';}).join('')+(rows.length>6?'<div class="small">+ '+(rows.length-6)+' outros</div>':'')+'</div>';}
// linha do dia: blocos coloridos por cliente nos horários lançados
function dayline(l,d){var bl=[];
  l.forEach(function(x){if(!x.ini)return;var a=t2m(x.ini),b=x.fim?t2m(x.fim):a+x.min;if(b<=a)b=Math.min(a+x.min,1440);bl.push({a:a,b:b,c:cliCor(x.cliente),t:x.ini+'–'+(x.fim||m2t(b))+' · '+lancTitulo(x)});});
  var at=S.ativo,now=new Date(),nm=now.getHours()*60+now.getMinutes();
  if(at&&ds(new Date(at.inicio))===d)bl.push({a:t2m(nowT(new Date(at.inicio))),b:Math.max(nm,t2m(nowT(new Date(at.inicio)))+1),c:cliCor(at.cliente),t:'Agora · '+lancTitulo(at),live:1});
  if(!bl.length)return '';
  var lo=Math.min.apply(null,[8*60].concat(bl.map(function(b){return b.a;}))),hi=Math.max.apply(null,[19*60].concat(bl.map(function(b){return b.b;})));
  lo=Math.floor(lo/60)*60;hi=Math.min(1440,Math.ceil(hi/60)*60);var P=function(v){return (v-lo)/(hi-lo)*100;},stp=(hi-lo)/60>10?3:2,tk='';
  for(var h=Math.ceil(lo/60/stp)*stp;h*60<=hi;h+=stp){var p=P(h*60);if(p>3&&p<97)tk+='<span style="left:'+p+'%">'+h+'h</span>';}
  return '<div><div class="dayline">'+bl.map(function(b){return '<i'+(b.live?' class="live"':'')+' style="left:'+P(b.a)+'%;width:'+(P(b.b)-P(b.a))+'%;background-color:'+b.c+'" title="'+esc(b.t)+'"></i>';}).join('')+
    (d===TODAY&&nm>lo&&nm<hi?'<span class="now" style="left:'+P(nm)+'%" title="Agora"></span>':'')+'</div><div class="ticks"><span style="left:0;transform:none">'+(lo/60)+'h</span>'+tk+'<span style="right:0;left:auto;transform:none">'+(hi/60)+'h</span></div></div>';}
function porCliente(l){return agrupa(l,function(x){return x.cliente||'_';},function(x){return cliNome(x.cliente);});}

/* ---------- pedaços ---------- */
function hdr(t,l,r){return '<div class="hdr"><div>'+(l||'')+'</div><h1>'+esc(t)+'</h1><div class="r">'+(r||'')+'</div></div>';}

    (opts.noAct?'':'<button class="ib" data-act="continuar" data-id="'+l.id+'" aria-label="Continuar: iniciar cronômetro com os mesmos dados" title="Continuar">'+PLAY+'</button><button class="ib" data-act="editar" data-id="'+l.id+'" aria-label="Editar lançamento">'+PEN+'</button>')+'</li>';}
function metaBar(min,meta){var p=meta>0?Math.min(min/meta*100,100):0;return '<div class="bar"><div style="width:'+p+'%;background:'+(min>=meta?'var(--ok)':'var(--acc)')+'"></div></div>';}

/* ---------- telas ---------- */

    '<div class="focus">';
    if(p){var pm=p.plano||0,over=pm&&(now-p.ini)/1000>pm*60;
      h+='<div class="plantbox">'+planta(p.seq?(S.jardim.find(function(x){return x.id===p.seq;})||{min:0}).min:0,p.murchou?'murcha':'pausa',150)+'</div>'+

function periodo(){var t=TODAY,dom=addDays(t,-toD(t).getDay()),d=toD(t),ini,fim,nome;
  if(ui.per==='semana'){ini=dom;fim=addDays(dom,6);nome='Esta semana';}
  else if(ui.per==='semanaPassada'){ini=addDays(dom,-7);fim=addDays(dom,-1);nome='Semana passada';}
  else if(ui.per==='mes'){ini=ds(new Date(d.getFullYear(),d.getMonth(),1));fim=ds(new Date(d.getFullYear(),d.getMonth()+1,0));nome=MESES[d.getMonth()]+' de '+d.getFullYear();}
  else if(ui.per==='mesPassado'){ini=ds(new Date(d.getFullYear(),d.getMonth()-1,1));fim=ds(new Date(d.getFullYear(),d.getMonth(),0));var pm=toD(ini);nome=MESES[pm.getMonth()]+' de '+pm.getFullYear();}
  else{ini=ui.de||addDays(t,-30);fim=ui.ate||t;nome=fmtDY(ini)+' a '+fmtDY(fim);}
  return {ini:ini,fim:fim,nome:nome};}

    document.title=(plano&&falta<0?'⏰ Volte ao trabalho · ':'☕ Pausa · ')+TITULO;
    if(plano&&falta<=0&&ui.avisado!==a.pausa.ini){ui.avisado=a.pausa.ini;avisarFimPausa();render();}
    if(plano&&-falta>(+S.cfg.tol||5)*60&&!a.pausa.murchou){a.pausa.murchou=true;save();render();}
  }else document.title='⏱ '+hms(trabSeg(a,now))+' · '+TITULO;

/* ---------- foco: tempo trabalhado, sequência sem pausa e a planta ---------- */
function pausaSeg(a,now){return (a.pausas||[]).reduce(function(s,p){return s+(p.fim-p.ini);},0)/1000+(a.pausa?(now-a.pausa.ini)/1000:0);}
function trabSeg(a,now){return Math.max(0,(now-a.inicio)/1000-pausaSeg(a,now));}
function seqSeg(a,now){return a.pausa?0:Math.max(0,(now-(a.focoIni||a.inicio))/1000);}
var ESTAGIOS=[[0,'Semente'],[5,'Broto'],[15,'Muda'],[25,'Árvore'],[50,'Árvore grande'],[90,'Árvore frondosa']];
function estagio(min){var e=ESTAGIOS[0];ESTAGIOS.forEach(function(x){if(min>=x[0])e=x;});return {nome:e[1],min:e[0]};}
// desenho original: vaso + caule que cresce + folhas; vira árvore com copa a partir de 25 min
function planta(min,estado,px){

  var t=Math.min(min/90,1),h=min<5?4+min*1.5:12+68*t,cx=60,base=96,s='<svg viewBox="0 0 120 130" width="'+px+'" height="'+Math.round(px*130/120)+'" role="img" aria-label="'+(mur?'Planta murcha':estagio(min).nome+' com '+min+' minutos de foco')+'">';
  s+='<ellipse cx="60" cy="124" rx="34" ry="4" fill="rgba(0,0,0,.12)"/><path d="M34 96h52l-6 28H40z" fill="#C2410C"/><rect x="31" y="92" width="58" height="8" rx="3" fill="#EA580C"/><ellipse cx="60" cy="93" rx="26" ry="3" fill="#57290F"/>';
  var g='<g'+(mur?' transform="rotate(14 60 '+base+')"':'')+'>';
  if(min<5){g+='<ellipse cx="60" cy="'+(base-2)+'" rx="5" ry="3.5" fill="#92400E"/>'+(min>=1?'<path d="M60 '+(base-3)+'v-'+(min*1.5)+'" stroke="'+ver+'" stroke-width="2.5" stroke-linecap="round"/>':'');}
  else if(min<25){var top=base-h;g+='<path d="M60 '+base+'Q57 '+(base-h/2)+' 60 '+top+'" stroke="'+ver+'" stroke-width="3" fill="none" stroke-linecap="round"/>';
    var n=min<15?2:4;for(var i=0;i<n;i++){var y=top+6+i*(h-10)/Math.max(n,1),d=i%2?1:-1;g+='<path d="M60 '+y+'q'+(d*14)+' -10 '+(d*18)+' -2q'+(-d*8)+' 8 '+(-d*18)+' 2z" fill="'+(i%2?ver:ver2)+'"/>';}
    g+='<path d="M60 '+top+'q-8 -8 -2 -14q8 4 2 14z" fill="'+ver2+'"/>';}
  else{var top2=base-h,r=16+24*Math.min((min-25)/65,1);g+='<path d="M57 '+base+'L58 '+(top2+r*0.4)+'L62 '+(top2+r*0.4)+'L63 '+base+'z" fill="'+tronco+'"/>'+
    '<circle cx="'+(cx-r*0.55)+'" cy="'+(top2+r*0.25)+'" r="'+(r*0.7)+'" fill="'+ver+'"/><circle cx="'+(cx+r*0.55)+'" cy="'+(top2+r*0.25)+'" r="'+(r*0.7)+'" fill="'+ver+'"/><circle cx="'+cx+'" cy="'+(top2-r*0.15)+'" r="'+r+'" fill="'+ver2+'"/>'+
    (min>=90&&!mur?'<circle cx="'+(cx-r*0.4)+'" cy="'+(top2)+'" r="3.5" fill="#EF4444"/><circle cx="'+(cx+r*0.35)+'" cy="'+(top2+r*0.3)+'" r="3.5" fill="#EF4444"/><circle cx="'+(cx+r*0.1)+'" cy="'+(top2-r*0.5)+'" r="3.5" fill="#EF4444"/>':'');}
  g+='</g>';s+=g;

function avisarFimPausa(){try{if(navigator.vibrate)navigator.vibrate([300,150,300]);}catch(e){}

  try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),gn=c.createGain();o.frequency.value=880;gn.gain.value=0.08;o.connect(gn);gn.connect(c.destination);o.start();setTimeout(function(){o.stop();c.close();},400);}catch(e){}}
// guarda a sequência que acabou (vira árvore se passar do mínimo)
function fecharSeq(a,now){var min=Math.round(seqSeg(a,now)/60);if(min<1)return null;S.jardim=S.jardim||[];
  var j={id:uid(),data:ds(new Date(a.focoIni||a.inicio)),min:min,sess:a.inicio,murcha:false};S.jardim.push(j);return j;}

/* ---------- cronômetro ---------- */
function iniciar(dados){if(S.ativo)return;var now=Date.now(),dm=demById(dados.dem);S.ativo={inicio:now,focoIni:now,pausas:[],pausa:null,cliente:dados.cliente||'',projeto:dados.projeto||'',ativ:dados.ativ||'',desc:dados.desc||'',fat:dados.fat!==false,dem:dm?dm.id:''};
  if(dm&&dm.status==='fazer')setSt(dm,'andamento','Comecei a trabalhar');ui.plantaMin=-1;commit();}
function pausar(plano){var a=S.ativo;if(!a||a.pausa)return;var now=Date.now(),j=fecharSeq(a,now);a.pausa={ini:now,plano:plano||0,seq:j?j.id:'',murchou:false};
  try{if(plano&&window.Notification&&Notification.permission==='default')Notification.requestPermission();}catch(e){}commit();}
function retomar(){var a=S.ativo;if(!a||!a.pausa)return;var now=Date.now(),p=a.pausa;
  if(p.murchou&&p.seq){var j=S.jardim.find(function(x){return x.id===p.seq;});if(j)j.murcha=true;}
  a.pausas.push({ini:p.ini,fim:now,plano:p.plano});a.pausa=null;a.focoIni=now;ui.plantaMin=-1;document.title=TITULO;commit();}
function parar(){var a=S.ativo;if(!a)return;var now=Date.now();
  if(a.pausa){var p=a.pausa;if(p.murchou&&p.seq){var jj=S.jardim.find(function(x){return x.id===p.seq;});if(jj)jj.murcha=true;}a.pausas.push({ini:p.ini,fim:now,plano:p.plano});a.pausa=null;}
  else fecharSeq(a,now);
  var ini=new Date(a.inicio),trab=trabSeg(a,now),min=arred(trab/60),ds0=ds(ini),pmin=Math.round(pausaSeg(a,now)/60);
  if(trab>16*3600&&!confirm('O cronômetro marca mais de 16 horas de trabalho. Salvar assim mesmo? (Dá para corrigir depois em Editar.)'))return;
  S.lanc.push({id:uid(),data:ds0,ini:nowT(ini),fim:nowT(new Date(now)),min:min,cliente:a.cliente,projeto:a.projeto,ativ:a.ativ,desc:a.desc,fat:a.fat,pausas:a.pausas.length,pausaMin:pmin,dem:a.dem||''});
  ui.f={cliente:a.cliente,projeto:a.projeto,ativ:a.ativ,desc:'',fat:a.fat,dem:''};S.ativo=null;document.title=TITULO;commit();}

  case 'entrarEmail':var em=document.getElementById('lgEmail').value.trim(),pw=document.getElementById('lgSenha').value;if(!em||!pw){alert('Preencha e-mail e senha.');return;}FB.signInEmail(em,pw).catch(function(err){alert(errAuth(err));});return;
  case 'esqueci':var em2=document.getElementById('lgEmail').value.trim();if(!em2){alert('Digite seu e-mail no campo acima.');return;}FB.resetSenha(em2).then(function(){alert('Se existir uma conta com senha para '+em2+', chegou um e-mail para criar uma nova senha.');},function(err){alert(errAuth(err));});return;
  case 'criarSenha':var ns=document.getElementById('novaSenha').value;if(ns.length<6){alert('A senha precisa ter pelo menos 6 caracteres.');return;}FB.criarSenha(ns).then(function(){alert('Senha criada!');render();},function(err){alert(errAuth(err));});return;
  case 'sair':if(confirm('Sair da conta? Seus dados continuam salvos nela.'))FB.signOut();return;
  }
});
function errAuth(e){var c=e&&e.code||'';return ({'auth/invalid-credential':'E-mail ou senha incorretos. Se você sempre entrou com o Google, crie a senha primeiro (entrando com o Google no Safari ou no computador).','auth/invalid-email':'E-mail inválido.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.','auth/too-many-requests':'Muitas tentativas. Espere alguns minutos.','auth/requires-recent-login':'Por segurança, saia e entre de novo com o Google, depois crie a senha.','auth/provider-already-linked':'Essa conta já tem senha.','auth/network-request-failed':'Sem internet.'})[c]||('Não foi possível ('+(c||'erro')+').');}
